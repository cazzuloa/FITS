name: Changelog

# Génère le CHANGELOG.md et la GitHub Release lors de la publication d'un tag.
on:
  push:
    tags:
      - 'v[0-9]*'
      - 'V[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag à documenter (ex. v0.3.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: changelog
  cancel-in-progress: false

jobs:
  changelog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4
        with:
          # On travaille sur la branche par défaut pour pouvoir commiter
          # le CHANGELOG, tout en récupérant l'historique et les tags.
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Déterminer le tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="${INPUT_TAG:-$REF_NAME}"
          if ! git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "::error::Le tag ${TAG} n'existe pas."
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Générer la section de changelog
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          chmod +x .github/scripts/generate-changelog.sh
          .github/scripts/generate-changelog.sh \
            "$TAG" CHANGELOG.md "$RUNNER_TEMP/changelog-section.md"

      - name: Publier la GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/changelog-section.md"
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file "$RUNNER_TEMP/changelog-section.md"
          fi

      - name: Commiter le CHANGELOG
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if git diff --quiet -- CHANGELOG.md; then
            echo "CHANGELOG.md déjà à jour."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add CHANGELOG.md
          git commit -m "docs: mise à jour du CHANGELOG pour ${TAG} [skip ci]"

          # Une protection de branche peut refuser le push direct : dans ce cas
          # il faudra passer par une pull request.
          git push origin "HEAD:${BRANCH}"
